# Monorepo: build the frontend workspace. Netlify runs from this base dir.
[build]
base = "apps/web"
command = "pnpm install && pnpm build"
publish = "dist"

# Inject per-set Open Graph / Twitter meta into public study-set pages so
# shared links unfurl richly and search engines get real snippets. Runs before
# redirects; falls back to the default shell for private/unknown sets.
# (Source: apps/web/netlify/edge-functions/og-meta.ts — base dir is apps/web.)
[[edge_functions]]
path = "/view/*"
function = "og-meta"

# Dynamic XML sitemap of all public study sets (linked from robots.txt), so
# public pages are discoverable/indexable. Source:
# apps/web/netlify/edge-functions/sitemap.ts.
[[edge_functions]]
path = "/sitemap.xml"
function = "sitemap"

# Umami analytics, proxied same-origin so ad blockers treat it as first-party
# rather than a third-party request to analytics.yusufaf.dev. Must come before
# the SPA fallback below — Netlify applies the first matching rule.
# See C:\Projects\umami-flyio and apps/web/index.html.
[[redirects]]
from = "/s.js"
to = "https://analytics.yusufaf.dev/s.js"
status = 200

[[redirects]]
from = "/api/e"
to = "https://analytics.yusufaf.dev/api/e"
status = 200

# SPA routes: one rule per route in apps/web/src/AppRoutes.tsx, served the app
# shell with 200. Keep this list in sync when adding a route — a route missing
# here still renders, but answers 404. "/" is index.html itself.
[[redirects]]
from = "/login"
to = "/index.html"
status = 200

[[redirects]]
from = "/signUp"
to = "/index.html"
status = 200

# Netlify matches case-sensitively, React Router doesn't, and the nav links
# use ROUTES.SIGNUP ("/signup").
[[redirects]]
from = "/signup"
to = "/index.html"
status = 200

[[redirects]]
from = "/callback"
to = "/index.html"
status = 200

[[redirects]]
from = "/view/:id"
to = "/index.html"
status = 200

[[redirects]]
from = "/create"
to = "/index.html"
status = 200

[[redirects]]
from = "/create/:id"
to = "/index.html"
status = 200

[[redirects]]
from = "/profile"
to = "/index.html"
status = 200

[[redirects]]
from = "/explore"
to = "/index.html"
status = 200

[[redirects]]
from = "/combine/:id"
to = "/index.html"
status = 200

[[redirects]]
from = "/edit/:id"
to = "/index.html"
status = 200

[[redirects]]
from = "/study/:studysetId/:mode"
to = "/index.html"
status = 200

# Everything else: the same shell (the app renders its NotFound view) but with
# a real 404, so crawlers don't index unknown paths as duplicate pages.
[[redirects]]
from = "/*"
to = "/index.html"
status = 404

# Never let the browser HTTP-cache the service worker or manifest, so SW
# updates (and the asset cache-bust they trigger) reach returning visitors
# promptly instead of being served stale.
[[headers]]
for = "/sw.js"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
for = "/manifest.json"
[headers.values]
Cache-Control = "public, max-age=0, must-revalidate"
